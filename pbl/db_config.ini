; ---------------------------------------------------------------------------
; Jewellery ERP - database configuration
; ---------------------------------------------------------------------------
; Edit the [sqlserver] section to match your SQL Server, then run main.py.
; On first run the app will (if enabled) create the ODBC DSN, create the
; database (with its data files placed in this project folder), build the
; schema and seed the default admin user.
; ---------------------------------------------------------------------------

[database]
; engine = sqlanywhere -> connect to an existing SQL Anywhere DB via ODBC DSN
; engine = sqlserver   -> connect to SQL Server via ODBC DSN (pyodbc required)
; engine = sqlite      -> use a local SQLite file (no setup, for quick testing)
engine = sqlanywhere

[sqlserver]
; ----- These settings are shared by sqlanywhere and sqlserver engines -----

; ODBC driver name (only used for the sqlserver DSN-less fallback).
driver = ODBC Driver 17 for SQL Server

; SQL Server instance (sqlserver engine only).
server = localhost\SQLEXPRESS

; Database name (sqlserver engine only).
database = JewelleryERP

; Windows authentication (yes) or a database login with uid/pwd (no).
; SQL Anywhere uses a database login, so set this to: no
trusted_connection = no

; SQL Anywhere database login. Leave blank to use the credentials already
; stored in the DSN. If connection is refused, fill these in.
uid =
pwd =

[sqlanywhere]
; SQL Anywhere 17 CAN open gm2024.db (dbunload v17 connected fine). The old DSN
; was bound to an older driver, which caused the version error. So we connect to
; the database FILE directly using the v17 driver.

; --- Credentials: the database login the gmine ERP itself uses
;     (taken from connectdbf.srf in the PBL). ---
uid = supervisortopuid
pwd = thisisthetopuserlevelpwd

; v17 ODBC driver name (check diag.txt if this exact name doesn't work).
driver = SQL Anywhere 17

; MODE 1: start & open the database FILE with the v17 engine.
;   IMPORTANT: close your existing ERP first -- a .db file cannot be opened by
;   two engines at once. 'start = dbeng17' forces the v17 engine.
dbf = E:\FI916\jewellery erp software\gm2024.db
start = dbeng17

; MODE 2 (most reliable): connect to the ALREADY-RUNNING database.
;   Keep your ERP open (it starts gm2024 correctly), set connect_running = yes,
;   and blank out the 'dbf' line above. The app then just attaches to it.
connect_running = no
server = gm2024
database = gm2024

; >>> The existing ODBC DSN to connect to (from ODBC Data Sources). <<<
; Your DSNs include: gm2024, gm2007, 17db ...  Use the current one.
dsn = gm2024

; Existing DSN + existing database, so all auto-create is OFF.
create_dsn = no
create_database = no

; Place the database .mdf/.ldf files inside this project folder.
; Requires the SQL Server service account to have write access to the folder;
; if it fails the app falls back to SQL Server's default data location.
db_in_folder = yes

; Encrypt setting for ODBC Driver 18 (set to no for local dev to avoid SSL errors).
encrypt = no
